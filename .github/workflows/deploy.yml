name: Deploy BlessEq to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove source files not needed for deployment
        run: |
          # P1-15: Exclude PPTX source files (35MB) from GitHub Pages upload
          rm -rf PPTX/
          # Remove Python extraction scripts (not needed on web)
          rm -rf scripts/ extract*.py verify*.py
          echo "Deployment artifact size optimized."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
